[package]
name = "daisyloop"
version = "0.1.0"
edition = "2021"

[dependencies]
iceberg = "0.10.1"
iceberg-catalog-sql = "0.10.1"
arrow-array = "58"
arrow-schema = "58"
parquet = "58"
sqlx = { version = "0.8", default-features = false, features = ["any", "sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
hidapi = "2"
nvml-wrapper = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
crc32fast = "1"
log = "0.4"
simplelog = "0.12"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_JobObjects"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
strip = true
