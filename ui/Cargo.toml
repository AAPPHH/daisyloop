[package]
name = "daisyloop-ui"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
name = "daisyloop_ui"
path = "src/lib.rs"

[[bin]]
name = "daisyloop-ui"
path = "src/main.rs"

[[bin]]
name = "daisyloop-mock"
path = "src/bin/mock.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_Graphics_Dwm"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
